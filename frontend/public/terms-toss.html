<div class="card">
<h2>제1조 (목적)</h2>
<p>이 약관은 공사공삼(이하 "운영자")이 토스 앱 안에서 제공하는 "토닥토닥 별빛타로"(이하 "서비스")의 이용 조건과 운영자·이용자의 권리, 의무를 정하는 것을 목적으로 합니다.</p>

<h2>제2조 (서비스 내용)</h2>
<ol>
<li>서비스는 이용자가 입력한 고민에 맞춰 타로 카드를 뽑고, AI가 카드의 의미를 풀이해 주는 오락·참고용 콘텐츠입니다.</li>
<li>풀이는 AI가 생성한 결과이며 정확성이나 실제 결과를 보장하지 않습니다.</li>
<li>서비스는 전문 상담, 의학·심리·법률·투자 조언을 대신하지 않습니다. 힘든 상황이라면 전문가나 상담 기관(자살예방 상담전화 109 등)의 도움을 받으시기 바랍니다.</li>
</ol>

<h2>제3조 (이용 및 토스 로그인)</h2>
<ol>
<li>서비스는 토스 로그인을 통해 이용할 수 있으며, 일부 기능은 로그인 없이도 이용할 수 있습니다.</li>
<li>운영자는 서비스 제공에 필요한 최소한의 정보만 이용하며, 토스 로그인으로 전달받은 이름은 저장하지 않습니다.</li>
<li>이용자는 언제든지 토스 앱에서 서비스 연결을 해제할 수 있습니다.</li>
</ol>

<h2>제4조 (무료 이용과 유료 서비스)</h2>
<ol>
<li>서비스의 기본 기능은 현재 한시적으로 무료로 제공되며, 일일 이용 횟수에 제한이 있을 수 있습니다.</li>
<li>일부 기능은 "코인"을 사용해 이용할 수 있습니다. 코인은 토스 인앱결제로 구매하며, 상품의 종류와 가격은 구매 화면에 표시된 내용을 따릅니다.</li>
<li>코인은 서비스 안에서만 사용할 수 있고 현금으로 환급되지 않습니다.</li>
<li>구매 취소와 환불은 관련 법령과 토스 인앱결제 정책에 따릅니다. 이미 사용한 코인은 환불이 제한될 수 있습니다.</li>
<li>운영자는 무료 제공 범위와 유료 전환 시기, 코인 가격을 변경할 수 있으며, 변경 전에 서비스 화면에서 안내합니다.</li>
</ol>

<h2>제5조 (광고)</h2>
<p>서비스에는 토스 인앱 광고가 표시될 수 있습니다.</p>

<h2>제6조 (이용자의 의무)</h2>
<p>이용자는 다음 행위를 해서는 안 됩니다.</p>
<ol>
<li>서비스를 비정상적인 방법으로 이용하거나 자동화 도구로 반복 접속하는 행위</li>
<li>타인의 정보를 도용하거나 서비스의 결제·코인 체계를 부정하게 이용하는 행위</li>
<li>서비스를 해킹하거나 운영을 방해하는 행위</li>
<li>법령 또는 공서양속에 반하는 내용을 입력하는 행위</li>
</ol>

<h2>제7조 (서비스 변경과 중단)</h2>
<p>운영자는 서비스를 개선하기 위해 기능을 변경하거나, 시스템 점검·장애·천재지변 등 불가피한 사유가 있으면 서비스를 일시 중단할 수 있습니다. 중요한 변경은 서비스 화면에서 안내합니다.</p>

<h2>제8조 (책임의 제한)</h2>
<ol>
<li>운영자는 AI 풀이의 내용을 근거로 이용자가 내린 판단이나 결정의 결과에 대해 책임지지 않습니다.</li>
<li>운영자는 고의 또는 중대한 과실이 없는 한, 천재지변이나 외부 서비스(토스 등)의 장애로 인한 손해에 책임지지 않습니다.</li>
</ol>
